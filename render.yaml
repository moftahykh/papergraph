services:
  - type: web
    name: papergraph-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "15"
      - key: CROSSREF_MAILTO
        value: "khalilalrahmanmeftah@csit.std.iutt.edu.ye"
      - key: OPENALEX_MAILTO
        value: "khalilalrahmanmeftah@csit.std.iutt.edu.ye"
      - key: SEMANTIC_SCHOLAR_API_KEYS
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: "papergraph-cb9c3"
