name: PaperGraph CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded API keys and secrets..."
          # NOTE: firebase_options.dart is EXEMPT — Firebase client API keys are
          # not secrets; they ship inside every APK/IPA and are protected by
          # Firebase security rules, not by secrecy.
          ! grep -rnE "AIzaSy[a-zA-Z0-9_-]{33}" flutter_app/lib/ --exclude=firebase_options.dart
          ! grep -rnE "api_key\s*=\s*['\"][a-zA-Z0-9_-]{20,}['\"]" flutter_app/lib/ --exclude=firebase_options.dart
          # No real .env file may ever be tracked (only .env.example templates)
          ! git ls-files | grep -E '(^|/)\.env$'
          echo "Secret scan passed successfully!"

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: papergraph
          POSTGRES_PASSWORD: papergraph_dev_pass
          POSTGRES_DB: papergraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papergraph -d papergraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: papergraph
      POSTGRES_PASSWORD: papergraph_dev_pass
      POSTGRES_DB: papergraph_test
      FIREBASE_PROJECT_ID: papergraph-cb9c3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          # Lean runtime deps + test deps. Do NOT `pip install -e .`:
          # flat-layout auto-discovery fails (multiple top-level packages),
          # and pytest-asyncio is required by asyncio_mode=auto in pyproject.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run database migrations
        run: |
          cd backend
          python -m alembic upgrade head
      - name: Run pytest suite
        run: |
          cd backend
          python -m pytest -q

  flutter-tests:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # No version pin: pubspec.yaml requires Dart SDK ^3.12.2.
          channel: stable
      - name: Mock firebase_options.dart
        run: |
          cat << 'EOF' > flutter_app/lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform { return const FirebaseOptions(apiKey: 'mock', appId: 'mock', messagingSenderId: 'mock', projectId: 'mock'); }
          }
          EOF
      - name: Install Flutter dependencies
        run: cd flutter_app && flutter pub get
      - name: Analyze code
        # Latest-stable SDKs introduce new lint warnings over time; CI must
        # fail on real ERRORS, not on style warnings the author's SDK lacked.
        run: cd flutter_app && flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter tests
        run: cd flutter_app && flutter test
