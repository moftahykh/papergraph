name: Scan one monitored graph now

on:
  workflow_dispatch:
    inputs:
      local_graph_id:
        description: "Existing active local_graph_id to scan now"
        required: true
        type: string
      confirmation:
        description: "Type I_UNDERSTAND_SCAN_ONE_GRAPH"
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan-one:
    name: Scan one graph and send real updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.RESEARCH_MONITORING_DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SEMANTIC_SCHOLAR_API_KEYS: ${{ secrets.SEMANTIC_SCHOLAR_API_KEYS }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      LOCAL_GRAPH_ID: ${{ inputs.local_graph_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Validate confirmation
        run: |
          test "$CONFIRMATION" = "I_UNDERSTAND_SCAN_ONE_GRAPH"
      - name: Make selected graph due
        run: python -m scripts.prepare_graph_scan
      - name: Scan selected graph
        run: python -m app.workers.monitoring_worker --once --max-graphs 1 --local-graph-id "$LOCAL_GRAPH_ID"
