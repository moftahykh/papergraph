name: List research notification test candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-candidates:
    name: List eligible Graph IDs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.RESEARCH_MONITORING_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: List eligible Graph IDs
        run: python -m scripts.list_research_navigation_candidates
